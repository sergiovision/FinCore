services:
  fincore:
    image: ${DOCKER_REGISTRY-}fincore
    ports:
        - 2020:2020
        - 2021:2021
        - 2022:2022
    volumes:
      # named volume: starts as a copy of the image's seed DB, so the tracked DB/ file is never modified
      - fincore-db:/DB
    environment:
        - ASPNETCORE_ENVIRONMENT=Production
    build:
      context: .
      dockerfile: FinCore/Dockerfile
      args:
        - skip_client_build=false

volumes:
  fincore-db:
